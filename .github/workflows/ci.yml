name: CI

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3
        with:
          jvm: "23"
      - run: ./mill __.publishLocal

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: compile
    # never run two jobs publishing to Sonatype Central at the same time
    concurrency:
      group: sonatype-central-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3
        with:
          jvm: "23"
      - name: Publish to Sonatype Central
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "is-terminal-${GITHUB_REF#refs/tags/v}" --shouldRelease false
          else
            for tag in $(git tag --points-at HEAD); do
              git tag -d "$tag"
            done
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/
          fi
        env:
          MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
          MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
      - name: Publish to GitHub Packages
        continue-on-error: true
        run: |
          ./mill -i mill.javalib.MavenPublishModule/publishAll \
            --publishArtifacts __.publishArtifacts \
            --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
            --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
        env:
          MILL_MAVEN_USERNAME: ${{ github.actor }}
          MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
